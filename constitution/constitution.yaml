### =====================================================================
### V12 ECOSYSTEM CONSTITUTION — CANONICAL MACHINE FORM
### Instrument V12-CONST-001
###
### This file is the authority. CONSTITUTION.md is its human rendering.
### The SHA-256 digest of this file is recorded in constitution.lock and
### verified at process start. A mismatch prevents the service starting.
###
### A rule's `predicate` describes the VIOLATING condition. If the
### predicate evaluates true against the action context, the rule is
### breached and its sanction applies.
### =====================================================================

instrument: V12-CONST-001
version: "1.3.0"
ratified: "2026-08-09"
amended: "2026-08-13"

# Ecosystem topology. V12 Multimedia is the head; R.M.P.M is the body and the
# principal public representation of the company.
topology:
  head: v12_multimedia
  body: rmpm
  public_surface: rmpm
supremacy: absolute
fail_closed: true
enforcement: deterministic          # never delegated to a language model

# Article IX §9.5 — applications whose users hold a direct, federated interface.
direct_interface_origins:
  - v12_multimedia
  - orion_prime
  - sonicstream
  - ceos

# Article XIV §14.1 — applications that may commission work directly of R.M.P.M.
# SonicStream and Orion Prime hold the executing channel; V12 Multimedia holds it
# as head of the body. No other application may open a commission.
commission_origins:
  - sonicstream
  - orion_prime
  - v12_multimedia

# Article XIV §14.4 — the functions R.M.P.M will accept a commission for. A
# request outside this catalogue is refused at intake, in writing.
commission_functions:
  - seo.authority
  - audience.expansion
  - campaign.launch
  - pr.placement
  - catalog.velocity
  - sentiment.watch
  - data.request
  - syndication.amplify

# Article XIV §14.5 — the reach mandate. This figure may be RAISED by amendment.
# Article XIV is entrenched, so it may never be lowered.
reach_mandate_pct: 80.0
reach_rework_rounds: 3

# Article XIV §14.9 — the standing daily City World dispatch and its destinations.
daily_dispatch:
  source: orion_prime
  dataset: city-world/current
  destinations: [sociofy, ceos, sonicstream]
  cadence_hours: 24
  breach_hours: 30

# Article XV — financial administration. Headless Financial is the settlement
# authority for the whole ecosystem: no monetary movement occurs outside it.
financial:
  settlement_authority: headless_financial
  reserve_ttl_seconds: 900
  reconciliation_hours: 24
  divergence_tolerance: "0.0000"
  currencies: [USD, EUR, GBP, JPY, CAD, AUD]
  settlement_kinds:
    - campaign.spend
    - commission.production
    - partner.commission
    - subscription.charge
    - refund
    - chargeback
    - adjustment
  inbound_event_kinds:
    - settlement.confirmed
    - settlement.failed
    - payment.received
    - chargeback.opened
    - payout.completed
    - fx.marked
    - statement.posted

# Article XIII §13.12 — every destination City World must rule on separately.
feed_share_destinations:
  - sociofy
  - orion_prime
  - nexion
  - apex_atlas
  - ceos
  - sonicstream
  - v12_multimedia

# Article XIII §13.3 — action kinds that constitute a release.
release_kinds:
  - publish.syndicate
  - campaign.launch
  - price.set
  - markdown.apply
  - media.purchase
  - spend.execute
  - atlas.transit
  - feed.share
  - firewall.ruleset.publish
  - security.control.change
  - agent.scope.grant
  - agent.prompt.write
  - agent.tool.register
  - deploy.production
  - constitution.amend
  - public.assertion
  - commission.dispatch
  - dispatch.daily
  - settlement.submit
  - payout.execute
  - refund.issue

inspectorate:
  minimum_seated: 3
  ordinary_rule: simple_majority
  unanimity_required_for: [entrenched, critical, catastrophic, constitution.amend]
  review_window_hours: 24
  certificate_ttl_seconds: 3600
  silence_is: REFUSED

signatories:
  - v12_multimedia
  - rmpm
  - orion_prime
  - v12_os
  - headless_financial
  - sonicstream
  - sociofy
  - ceos
  - nexion
  - apex_atlas
  - atlas_galaxy

# Articles that may be tightened but never weakened, narrowed or repealed.
entrenched_articles: [I, II, III, VII, X, XII, XIII, XIV, XV]

sanctions:
  advisory:      WARN
  moderate:      THROTTLE
  serious:       SUSPEND_AGENT
  critical:      QUARANTINE_TENANT
  catastrophic:  HALT_ECOSYSTEM

escalation:
  window_seconds: 86400
  ladder:
    advisory:  {count: 3, becomes: moderate}
    moderate:  {count: 3, becomes: serious}
    serious:   {count: 2, becomes: critical}

time_limits:
  inspectorate_review_hours: 24
  certificate_ttl_seconds: 3600
  city_world_determination_hours: 4
  hardening_cycle_days: 7
  hardening_breach_days: 9
  prohibited_alert_seconds: 60
  propagation_ack_seconds: 900
  authorisation_ttl_seconds: 900
  token_ttl_seconds: 3600
  amendment_notice_hours: 72
  chain_sweep_hours: 24
  export_fulfilment_hours: 72

# ---------------------------------------------------------------------
# SCHEDULE A — prohibited content and data classes (Article VII)
# ---------------------------------------------------------------------
prohibited_classes:
  A1:  {label: "CSAM / sexualisation of minors",       severity: catastrophic, preserve: true}
  A2:  {label: "Stolen credentials & secrets",          severity: critical,     preserve: true}
  A3:  {label: "Unlawfully obtained personal data",     severity: critical,     preserve: true}
  A4:  {label: "Out-of-scope payment instrument data",  severity: critical,     preserve: true}
  A5:  {label: "Malware / exploit payloads",            severity: critical,     preserve: true}
  A6:  {label: "Sanctions & export-control violations", severity: critical,     preserve: true}
  A7:  {label: "Counterfeit & infringing media",        severity: serious,      preserve: true}
  A8:  {label: "Fraudulent commerce",                   severity: serious,      preserve: true}
  A9:  {label: "Market manipulation / MNPI",            severity: critical,     preserve: true}
  A10: {label: "Prompt injection / instruction smuggling", severity: serious,   preserve: true}
  A11: {label: "Jurisdictionally unlawful content",     severity: serious,      preserve: true}
  A12: {label: "Deceptive synthetic media of real persons", severity: serious,  preserve: true}

# ---------------------------------------------------------------------
# BINDING RULES
# ---------------------------------------------------------------------
rules:

  # ---------------- ARTICLE II — TENANT SOVEREIGNTY -------------------
  - id: ART2-S1-RLS-CONTEXT
    article: II
    section: "2.1"
    title: "Every data action carries a bound organisation claim"
    severity: critical
    predicate:
      any:
        - {fact: action.organization_id, op: is_null}
        - {fact: context.rls_bound, op: falsy}

  - id: ART2-S2-VECTOR-TENANT-FILTER
    article: II
    section: "2.2"
    title: "Vector queries must carry a tenant metadata filter"
    severity: critical
    applies_to: [vector.query, semantic.search]
    predicate:
      any:
        - {fact: action.filter.tenant_id, op: is_null}
        - {fact: action.filter.tenant_id, op: ne, fact_value: action.organization_id}

  - id: ART2-S5-NO-UNGRANTED-EGRESS
    article: II
    section: "2.5"
    title: "No tenant data leaves the boundary without a logged grant"
    severity: critical
    applies_to: [ecosystem.egress, data.export]
    predicate:
      any:
        - {fact: action.grant_id, op: is_null}
        - {fact: action.grant_scope, op: not_in, value: [tenant, ecosystem]}

  # ---------------- ARTICLE III — DETERMINISM OF MONEY ----------------
  - id: ART3-S1-NO-MODEL-ARITHMETIC
    article: III
    section: "3.1"
    title: "Monetary values may not originate from a language model"
    severity: critical
    applies_to: [ledger.post, spend.execute, price.set]
    predicate:
      any:
        - {fact: action.amount_source, op: eq, value: model}
        - {fact: action.amount_source, op: is_null}

  - id: ART3-S2-DOUBLE-ENTRY-BALANCE
    article: III
    section: "3.2"
    title: "Debits must equal credits"
    severity: critical
    applies_to: [ledger.post]
    predicate:
      all:
        - {fact: action.total_debit, op: not_null}
        - {fact: action.total_debit, op: ne, fact_value: action.total_credit}

  - id: ART3-S3-LEDGER-APPEND-ONLY
    article: III
    section: "3.3"
    title: "The ledger is append-only"
    severity: critical
    applies_to: [ledger.update, ledger.delete]
    predicate:
      always: true

  - id: ART3-S4-HASH-CHAIN-CONTINUITY
    article: III
    section: "3.4"
    title: "Each entry binds to the digest of its predecessor"
    severity: critical
    applies_to: [ledger.post]
    predicate:
      any:
        - {fact: action.previous_entry_hash, op: is_null}
        - {fact: action.entry_hash, op: is_null}

  - id: ART3-S5-MARGIN-FLOOR
    article: III
    section: "3.5"
    title: "Gross margin may not fall below the tenant floor"
    severity: serious
    applies_to: [price.set, markdown.apply]
    predicate:
      all:
        - {fact: action.resulting_margin_pct, op: not_null}
        - {fact: action.resulting_margin_pct, op: lt, fact_value: tenant.margin_floor_pct}

  # ---------------- ARTICLE IV — AUTHORISATION ------------------------
  - id: ART4-S1-NO-UNAUTHORISED-SPEND
    article: IV
    section: "4.1"
    title: "External spend requires a comptroller receipt"
    severity: critical
    applies_to: [spend.execute, campaign.launch, media.purchase]
    predicate:
      any:
        - {fact: action.authorisation.receipt_id, op: is_null}
        - {fact: action.authorisation.cleared_for_execution, op: falsy}

  - id: ART4-S3-VERDICT-CLOSED-SET
    article: IV
    section: "4.3"
    title: "The comptroller returns exactly one of three verdicts"
    severity: serious
    applies_to: [authorisation.issue]
    predicate:
      all:
        - {fact: action.status, op: not_null}
        - fact: action.status
          op: not_in
          value: [APPROVED, PARTIAL_MODERATED_APPROVAL, DENIED_INSUFFICIENT_FUNDS]

  - id: ART4-S4-SEPARATION-OF-DUTIES
    article: IV
    section: "4.4"
    title: "An agent may not authorise its own request"
    severity: serious
    applies_to: [spend.execute, authorisation.issue]
    predicate:
      all:
        - {fact: action.authorisation.issued_by, op: not_null}
        - {fact: action.authorisation.issued_by, op: eq, fact_value: action.agent_id}

  - id: ART4-S5-RECEIPT-BINDING
    article: IV
    section: "4.5"
    title: "Receipts are single-use, bound and time-limited"
    severity: critical
    applies_to: [spend.execute]
    predicate:
      any:
        - {fact: action.authorisation.consumed, op: truthy}
        - {fact: action.authorisation.expired, op: truthy}
        - {fact: action.amount, op: gt, fact_value: action.authorisation.authorized_spend_limit}
        - {fact: action.authorisation.target_sku, op: ne, fact_value: action.target_sku}

  - id: ART4-S6-INVENTORY-PRECONDITION
    article: IV
    section: "4.6"
    title: "No campaign against out-of-stock inventory"
    severity: moderate
    applies_to: [campaign.launch]
    predicate:
      any:
        - {fact: action.current_inventory, op: is_null}
        - {fact: action.current_inventory, op: lte, value: 0}

  # ---------------- ARTICLE V — EXPLAINABILITY ------------------------
  - id: ART5-S1-RATIONALE-REQUIRED
    article: V
    section: "5.1"
    title: "Consequential actions carry a plain-language rationale"
    severity: serious
    applies_to: [spend.execute, price.set, markdown.apply, campaign.launch, publish.syndicate, ledger.post]
    predicate:
      any:
        - {fact: action.rationale, op: is_null}
        - {fact: action.rationale, op: shorter_than, value: 24}

  - id: ART5-S3-NO-VACUOUS-RATIONALE
    article: V
    section: "5.3"
    title: "A rationale must name inputs and thresholds"
    severity: moderate
    applies_to: [spend.execute, price.set, markdown.apply]
    predicate:
      all:
        - {fact: action.rationale, op: not_null}
        - fact: action.rationale
          op: matches
          value: "(?i)^(the )?(model|ai|agent|system)\\s+(decided|determined|chose|thought)"

  # ---------------- ARTICLE VI — PROVENANCE ---------------------------
  - id: ART6-S1-PAYLOAD-ANCHORED
    article: VI
    section: "6.1"
    title: "Inbound batches are checksummed and anchored to an audit run"
    severity: serious
    applies_to: [ingest.batch]
    predicate:
      any:
        - {fact: action.payload_sha256, op: is_null}
        - {fact: action.pipeline_run_id, op: is_null}

  - id: ART6-S2-SCHEMA-AT-BORDER
    article: VI
    section: "6.2"
    title: "Payloads must satisfy their declared schema"
    severity: moderate
    applies_to: [ingest.batch, webhook.receive]
    predicate:
      - {fact: action.schema_valid, op: falsy}

  # ---------------- ARTICLE VII — LAWFUL CONTENT ----------------------
  - id: ART7-S1-PROHIBITED-CLASS
    article: VII
    section: "7.1"
    title: "Prohibited content or data must not be processed"
    severity: critical
    predicate:
      - {fact: classification.prohibited, op: truthy}

  - id: ART7-S2-CLASSIFIER-MANDATORY
    article: VII
    section: "7.2"
    title: "Every ingress passes the Sentinel classifier"
    severity: serious
    # Every crossing of the boundary, inbound AND outbound. A classifier that
    # only guards the way in is not a perimeter — data could leave, transit the
    # Atlas gate or reach a feed with the Sentinel never having run.
    applies_to: [ingest.batch, webhook.receive, upload.accept, ecosystem.ingress,
                 model.output, ecosystem.egress, data.export, feed.share,
                 atlas.transit, publish.syndicate, dispatch.daily,
                 commission.dispatch, financial.inbound]
    predicate:
      - {fact: classification.evaluated, op: falsy}

  - id: ART7-S5-NO-LAUNDERING
    article: VII
    section: "7.5"
    title: "Prohibited content may not be transformed to evade classification"
    severity: critical
    applies_to: [content.transform, content.paraphrase, content.translate]
    predicate:
      all:
        - {fact: action.source_classification.prohibited, op: truthy}

  - id: ART7-S6-INJECTION-IS-DATA
    article: VII
    section: "7.6"
    title: "Ingested instructions are data, never commands"
    severity: serious
    predicate:
      all:
        - {fact: action.instruction_origin, op: eq, value: ingested}
        - {fact: action.treated_as_command, op: truthy}

  # ---------------- ARTICLE VIII — THE PERIMETER ----------------------
  - id: ART8-S1-DEFAULT-DENY
    article: VIII
    section: "8.1"
    title: "Boundaries operate default-deny"
    severity: critical
    applies_to: [firewall.ruleset.publish]
    predicate:
      - {fact: action.default_policy, op: ne, value: deny}

  - id: ART8-S3-RATCHET
    article: VIII
    section: "8.3"
    title: "A hardening cycle may only narrow the attack surface"
    severity: critical
    applies_to: [firewall.ruleset.publish, security.control.change]
    predicate:
      all:
        - {fact: action.actor_type, op: eq, value: agent}
        - any:
            - {fact: action.widens_surface, op: truthy}
            - {fact: action.broadens_path, op: truthy}
            - {fact: action.broadens_method, op: truthy}
            - {fact: action.drops_signature_requirement, op: truthy}
            - {fact: action.drops_scope_requirement, op: truthy}
            - {fact: action.widens_origin_allowlist, op: truthy}

  - id: ART8-S3-RELAX-SCOPE
    article: VIII
    section: "8.3"
    title: "Relaxation requires a human with security:relax and a justification"
    severity: critical
    applies_to: [security.control.relax]
    predicate:
      any:
        - {fact: action.actor_type, op: ne, value: human}
        - {literal: "security:relax", op: not_in, fact_value: actor.scopes}
        - {fact: action.justification, op: shorter_than, value: 40}
        - {fact: action.countersigned_by, op: is_null}

  - id: ART8-S2-HARDENING-CADENCE
    article: VIII
    section: "8.2"
    title: "Hardening must complete at least every seven days"
    severity: serious
    applies_to: [security.cadence.check]
    predicate:
      - {fact: action.days_since_last_cycle, op: gt, value: 9}

  - id: ART8-S6-NO-CONTROL-DISABLE
    article: VIII
    section: "8.6"
    title: "No agent may disable, bypass or exempt itself from a control"
    severity: critical
    applies_to: [security.control.disable, security.control.bypass, security.exemption.grant]
    predicate:
      - {fact: action.actor_type, op: eq, value: agent}

  # ---------------- ARTICLE IX — COMITY & THE ATLAS GATE --------------
  - id: ART9-S1-SIGNED-TRANSIT
    article: IX
    section: "9.1"
    title: "Inter-application calls must be signed and tenant-scoped"
    severity: critical
    applies_to: [ecosystem.egress, ecosystem.ingress]
    predicate:
      any:
        - {fact: action.signature, op: is_null}
        - {fact: action.correlation_id, op: is_null}
        - {fact: action.organization_id, op: is_null}

  - id: ART9-S2-JOURNEY-ORDER
    article: IX
    section: "9.2"
    title: "The decision journey may not skip a stage"
    severity: serious
    applies_to: [pipeline.advance]
    predicate:
      - {fact: action.stage_order_valid, op: falsy}

  - id: ART9-S2-ORION-EVIDENCE-ONLY
    article: IX
    section: "9.2"
    title: "Orion Prime returns evidence, never instructions"
    severity: serious
    applies_to: [orion.query]
    predicate:
      - {fact: action.response_contains_directive, op: truthy}

  - id: ART9-S5-ATLAS-GATE
    article: IX
    section: "9.2"
    title: "Data enters the Atlas Galaxy only on ApexAtlas acceptance"
    severity: critical
    applies_to: [atlas.transit]
    predicate:
      any:
        - {fact: action.apex_verdict, op: ne, value: ACCEPTED}
        - {fact: action.apex_admission_token, op: is_null}

  - id: ART9-S3-NO-FUTILE-RESUBMISSION
    article: IX
    section: "9.3"
    title: "Apex refusal may not be re-submitted without material change"
    severity: serious
    applies_to: [apex.submit]
    predicate:
      all:
        - {fact: action.previously_refused, op: truthy}
        - {fact: action.material_change, op: falsy}

  - id: ART9-S4-PUBLICATION-DISCIPLINE
    article: IX
    section: "9.4"
    title: "Syndication requires classification, rationale and consent"
    severity: serious
    applies_to: [publish.syndicate]
    predicate:
      any:
        - {fact: classification.evaluated, op: falsy}
        - {fact: classification.prohibited, op: truthy}
        - {fact: action.publication_consent, op: falsy}
        - {fact: action.rationale, op: is_null}

  - id: ART9-S4-CLAIM-REPRODUCIBLE
    article: IX
    section: "9.4"
    title: "Published performance claims must be reproducible from the ledger"
    severity: serious
    applies_to: [publish.syndicate]
    predicate:
      all:
        - {fact: action.contains_performance_claim, op: truthy}
        - {fact: action.ledger_evidence_id, op: is_null}

  # ---------------- ARTICLE X — HUMAN AUTHORITY -----------------------
  - id: ART10-S2-HALT-IS-ABSOLUTE
    article: X
    section: "10.2"
    title: "No action proceeds while a halt is in force"
    severity: catastrophic
    predicate:
      any:
        - {fact: context.ecosystem_halted, op: truthy}
        - {fact: context.agent_suspended, op: truthy}

  - id: ART10-S3-NO-SELF-MODIFICATION
    article: X
    section: "10.3"
    title: "An agent may not alter its own capability surface"
    severity: critical
    applies_to: [agent.scope.grant, agent.prompt.write, agent.tool.register, constitution.amend]
    predicate:
      - {fact: action.actor_type, op: eq, value: agent}

  - id: ART10-S4-DUTY-OF-CANDOUR
    article: X
    section: "10.4"
    title: "Errors and violations may not be concealed or minimised"
    severity: critical
    applies_to: [report.emit]
    predicate:
      all:
        - {fact: action.known_failure, op: truthy}
        - {fact: action.reported_failure, op: falsy}

  - id: ART10-S5-ESCALATE-ON-UNCERTAINTY
    article: X
    section: "10.5"
    title: "Ambiguity resolves against action"
    severity: moderate
    predicate:
      all:
        - {fact: action.permission_determinate, op: not_null}
        - {fact: action.permission_determinate, op: falsy}
        - {fact: action.escalated, op: falsy}

  # ---------------- ARTICLE XII — AMENDMENT ---------------------------
  - id: ART12-S1-AMENDMENT-QUORUM
    article: XII
    section: "12.1"
    title: "Amendment requires two human signatories with constitution:amend"
    severity: catastrophic
    applies_to: [constitution.amend]
    predicate:
      any:
        - {fact: action.actor_type, op: ne, value: human}
        - {fact: action.signatory_count, op: lt, value: 2}

  - id: ART12-S4-ENTRENCHMENT
    article: XII
    section: "12.4"
    title: "Entrenched articles may be tightened but never weakened"
    severity: catastrophic
    applies_to: [constitution.amend]
    predicate:
      all:
        - {fact: action.touches_entrenched, op: truthy}
        - {fact: action.direction, op: eq, value: weaken}

  # ---------------- ARTICLE XIII — THE INSPECTORATE ------------------
  - id: ART13-S2-CERTIFICATE-REQUIRED
    article: XIII
    section: "13.2"
    title: "No process reaches release without a Certificate of Release"
    severity: critical
    applies_to:
      - publish.syndicate
      - campaign.launch
      - price.set
      - markdown.apply
      - media.purchase
      - spend.execute
      - atlas.transit
      - feed.share
      - firewall.ruleset.publish
      - security.control.change
      - agent.scope.grant
      - agent.prompt.write
      - agent.tool.register
      - deploy.production
      - constitution.amend
      - public.assertion
      - commission.dispatch
      - dispatch.daily
      - settlement.submit
      - payout.execute
      - refund.issue
    predicate:
      any:
        - {fact: action.certificate.id, op: is_null}
        - {fact: action.certificate.status, op: ne, value: CLEARED}

  - id: ART13-S8-SILENCE-IS-REFUSAL
    article: XIII
    section: "13.8"
    title: "An expired or pending review is a refusal, never deemed consent"
    severity: critical
    applies_to:
      - publish.syndicate
      - campaign.launch
      - price.set
      - markdown.apply
      - media.purchase
      - spend.execute
      - atlas.transit
      - feed.share
      - firewall.ruleset.publish
      - security.control.change
      - agent.scope.grant
      - agent.prompt.write
      - agent.tool.register
      - deploy.production
      - constitution.amend
      - public.assertion
      - commission.dispatch
      - dispatch.daily
      - settlement.submit
      - payout.execute
      - refund.issue
    predicate:
      any:
        - {fact: action.certificate.expired, op: truthy}
        - {fact: action.certificate.consumed, op: truthy}
        - {fact: action.certificate.status, op: in, value: [PENDING, EXPIRED, REFUSED, SUSPENDED]}

  - id: ART13-S4-QUORUM
    article: XIII
    section: "13.4"
    title: "The Inspectorate must be quorate and the vote sufficient"
    severity: critical
    applies_to: [inspectorate.certify]
    predicate:
      any:
        - {fact: action.seated, op: lt, value: 3}
